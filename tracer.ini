#== ET相撲 ==
# 連続回転スキャンでボトルを検出→追跡しながら接近→接触後に押し出す
# パラメータ: <スキャン半角deg> <最大検出距離mm> <押し出し距離mm>
# 最大検出距離は競技環境に合わせる(遠い壁を拾わないよう500mm程度を推奨)
# UltrasonicAlignTracer 110 500 30
# 前方の対象までの超音波距離を、100ms間隔で記録する。ロボットは走行・旋回しない。
RotateTracer TURN_RIGHT 90 35
RotateTracer TURN_LEFT 45 30
