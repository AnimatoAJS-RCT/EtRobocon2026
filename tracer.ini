#== 外周部 ==!
# 青目印を超えるとLAP
LineTracer 20000 50 80 100 RIGHT_EDGE 0.6 0.01 0.017 BLUE
#LineTracer 2000 55 60 80 RIGHT_EDGE 0.4 0 0.012 BLUE
# LineTracer 2000 35 40 80 LEFT_EDGE 0.2 0.0 0.05 BLUE
# ボトルまで行く

#== ボトルデリバリー ==

# BottleDeliveryTracer targetDistance targetBrightness pwm maxPwm edge kp ki kd
# targetDistance: 予約値。現在の接近ライントレース距離はプログラム内で100mm固定のため未使用
# targetBrightness: ライン判定の目標輝度（0-100の正規化値）
# pwm: 通常のライントレースPWM、maxPwm: 左右モーターPWMの上限
# edge: LEFT_EDGE または RIGHT_EDGE（Lコースでは自動反転）
# kp ki kd: ライントレースPIDゲイン（比例・積分・微分）
BottleDeliveryTracer 500 40 40 80 RIGHT_EDGE 0.4 0 0.012

ScenarioTracer 180 -60 -60
RotateTracer TURN_LEFT 90 40
ScenarioTracer 320 60 60


#== ETラリー ==!
#- ScenarioTracer 30 50 50
#- RotateTracer TURN_RIGHT 90 35
# movePwm turnPwm startX startY startHeading(0=E,90=N,180=W,270=S) lapCount red(4) blue(4) yellow(4) [endX endY endHeading]
# [markerEnable markerReflectionThreshold markerSnapWindowDeg markerCooldownTicks [markerSearchAngleDeg]]
#RallyTracer 40 40 4 1 90 1 4 2 5 2 1 3 1 4 2 5 3 5 4 4 0
# 指定順に QR 座標を走る場合: movePwm turnPwm startX startY startHeading routeX1 routeY1 [routeX2 routeY2 ...] [endX endY endHeading] [MARKER enable reflectionThreshold snapWindowDeg cooldownTicks [searchAngleDeg]]
# 実在 QR は 1..4、外周ゲート通過は 0 または 5 を指定する（直前の実在 QR へ自動で戻る）
# searchAngleDeg 省略時は 15 度（マーカー未検出時の首振り探索の片側角度）
RallyRouteTracer 50 50 4 1 90 4 2 4 3 4 4 0
#RallyRouteTracer 50 50 4 1 90 4 2 4 3 4 4 3 4 3 5 3 4 2 4 1 4 1 3 0 3 1 2 1 1 2 1 3 1 4 1 4 2 4 3 4 4 0 MARKER 1 60 180 25 90
#end

#== ET相撲 ==
# 凡そボトルがいる方角を向く
RotateTracer TURN_RIGHT 45 30
# ボトルの検出、押し出しを行う
UltrasonicAlignTracer 60 500 280 75 50 50 10 33

#== ゴール ==
# ゴールに向かって正対する
RotateTracer TURN_RIGHT 45 50
# ゴールまでのラインに向かって前進、ラインを見つけたら停止
ScenarioTracer 800 60 60 BLACK
# ラインを超えるように少し進む（ラインの外側をライントレースしたいので…）
ScenarioTracer 50 60 60
# ラインに向かって平衡になるように調整
RotateTracer TURN_RIGHT 90 50
# ゴール前の青目印まで進む
LineTracer 1500 55 80 100 LEFT_EDGE 0.6 0.01 0.017 BLUE
# 青ラインからゴール枠まで前進、ゴール
ScenarioTracer 850 80 80

